<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>專案檢視模式 | 智慧記憶 + 行程日期對應</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ---------- 預設主題變數 (default) ---------- */
        :root,
        [data-theme="default"] {
            --bg-body: #f1f5f9;
            --bg-header: #ffffff;
            --border-header: #e2e8f0;
            --text-header: #0f172a;
            --bg-tab-inactive: #f8fafc;

            --bg-tab-active: #1e293b;
            --text-tab-active: #ffffff;
            --tab-shadow: 0 2px 6px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
            --tab-shadow-hover: 0 4px 10px rgba(0, 0, 0, 0.08);
            --bg-sub-wrapper: #f8fafc;
            --border-sub: #e0e7ff;
            --bg-sub-tab-inactive: #eef2ff;
            --text-sub-tab-inactive: #4338ca;
            --bg-sub-tab-active: #4f46e5;

            --bg-sub-tab-hover: #e0e7ff;

            --button-outline-border: #cbd5e1;
            --button-outline-text: #1e293b;
            --shadow-color: rgba(0,0,0,0.08);
        }

        /* ---------- 海洋主題 (ocean) ---------- */
        [data-theme="ocean"] {
            --bg-body: #d9f1ff;

        /* ---------- 森林主題 (forest) ---------- */

        /* ---------- 暖陽主題 (sunset) ---------- */
        [data-theme="sunset"] {

            --border-sub: #fed7aa;

            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #fed7aa;
            --iframe-bg: #ffedd5;
            --modal-bg: white;
            --button-outline-border: #fdba74;
            --button-outline-text: #9a3412;

        /* ---------- 薰衣草主題 (lavender) ---------- */
        [data-theme="lavender"] {
            --bg-body: #f3edff;
            --bg-header: #ffffff;
            --border-header: #d8c8f0;
            --text-header: #4a2a6a;
            --bg-tab-inactive: #ede6f7;
            --text-tab-inactive: #5a3a7a;
            --bg-tab-active: #7a4a9e;
            --text-tab-active: white;
            --tab-shadow: 0 2px 8px rgba(122, 74, 158, 0.12);
            --tab-shadow-hover: 0 6px 12px rgba(122, 74, 158, 0.18);
            --bg-sub-wrapper: #f8f4ff;
            --border-sub: #d4c4e8;
            --bg-sub-tab-inactive: #ddd0f0;
            --text-sub-tab-inactive: #5a3a7a;
            --bg-sub-tab-active: #7a4a9e;
            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #d4c4e8;
            --iframe-bg: #ede6f7;
            --modal-bg: white;
            --button-outline-border: #c4b0d8;
            --button-outline-text: #4a2a6a;
            --shadow-color: rgba(122, 74, 158, 0.10);

        /* ---------- 櫻花主題 (sakura) ---------- */
        [data-theme="sakura"] {
            --bg-body: #fff0f2;
            --bg-header: #ffffff;
            --border-header: #f5c8d0;
            --text-header: #6a2a3a;
            --bg-tab-inactive: #fde8ec;

            --text-tab-active: white;
            --tab-shadow: 0 2px 8px rgba(196, 90, 106, 0.12);
            --tab-shadow-hover: 0 6px 12px rgba(196, 90, 106, 0.18);
            --bg-sub-wrapper: #fff5f7;
            --border-sub: #f5c8d0;
            --bg-sub-tab-inactive: #f5d0d8;
            --text-sub-tab-inactive: #7a3a4a;
            --bg-sub-tab-active: #c45a6a;
            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #f0c8d0;

            --modal-bg: white;
            --button-outline-border: #e8b0b8;
            --button-outline-text: #6a2a3a;
            --shadow-color: rgba(196, 90, 106, 0.10);
        }

        /* ---------- 夜空主題 (night) ---------- */
        [data-theme="night"] {
            --bg-body: #0b1120;
            --bg-header: #1e293b;
            --border-header: #334155;
            --text-header: #e2e8f0;
            --bg-tab-inactive: #334155;
            --text-tab-inactive: #cbd5e1;
            --bg-tab-active: #475569;
            --text-tab-active: #f1f5f9;
            --tab-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            --tab-shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.5);
            --bg-sub-wrapper: #1e293b;
            --border-sub: #334155;
            --bg-sub-tab-inactive: #334155;
            --text-sub-tab-inactive: #a5f3fc;
            --bg-sub-tab-active: #38bdf8;
            --text-sub-tab-active: #0f172a;
            --bg-sub-tab-hover: #475569;
            --iframe-bg: #0f172a;
            --modal-bg: #1e293b;
            --button-outline-border: #64748b;
            --button-outline-text: #cbd5e1;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        /* ===== 新增：楓葉 (maple) ===== */
        [data-theme="maple"] {
            --bg-body: #fdf6ee;
            --bg-header: #fdf6ee;
            --border-header: #d4a373;
            --text-header: #7a3e1a;
            --bg-tab-inactive: #fae9d6;
            --text-tab-inactive: #7a3e1a;
            --bg-tab-active: #b45f2a;
            --text-tab-active: white;
            --tab-shadow: 0 2px 8px rgba(180, 95, 42, 0.15);
            --tab-shadow-hover: 0 6px 12px rgba(180, 95, 42, 0.25);
            --bg-sub-wrapper: #fdf6ee;
            --border-sub: #e8c9aa;
            --bg-sub-tab-inactive: #f0d5b8;
            --text-sub-tab-inactive: #7a3e1a;
            --bg-sub-tab-active: #b45f2a;
            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #e8c9aa;
            --iframe-bg: #fae9d6;
            --modal-bg: #fdf6ee;
            --button-outline-border: #d4a373;
            --button-outline-text: #7a3e1a;
            --shadow-color: rgba(180, 95, 42, 0.15);
        }

        /* ===== 新增：銀杏 (ginkgo) ===== */
        [data-theme="ginkgo"] {
            --bg-body: #fcf9f0;
            --bg-header: #fcf9f0;
            --border-header: #d4b87a;
            --text-header: #6a5a1a;
            --bg-tab-inactive: #f5edd6;
            --text-tab-inactive: #6a5a1a;
            --bg-tab-active: #b49a3a;
            --text-tab-active: white;
            --tab-shadow: 0 2px 8px rgba(180, 154, 58, 0.15);
            --tab-shadow-hover: 0 6px 12px rgba(180, 154, 58, 0.25);
            --bg-sub-wrapper: #fcf9f0;
            --border-sub: #e6d8aa;
            --bg-sub-tab-inactive: #ede0b8;
            --text-sub-tab-inactive: #6a5a1a;
            --bg-sub-tab-active: #b49a3a;
            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #e6d8aa;
            --iframe-bg: #f5edd6;
            --modal-bg: #fcf9f0;
            --button-outline-border: #d4b87a;
            --button-outline-text: #6a5a1a;
            --shadow-color: rgba(180, 154, 58, 0.15);
        }

        /* ===== 新增：楓葉+銀杏混合 (maple-ginkgo) ===== */
        [data-theme="maple-ginkgo"] {
            --bg-body: #fdf7ed;
            --bg-header: #fdf7ed;
            --border-header: #c9a87a;
            --text-header: #6a4a1a;
            --bg-tab-inactive: #f5e8d0;
            --text-tab-inactive: #6a4a1a;
            --bg-tab-active: #b48a3a;
            --text-tab-active: white;
            --tab-shadow: 0 2px 8px rgba(180, 138, 58, 0.15);
            --tab-shadow-hover: 0 6px 12px rgba(180, 138, 58, 0.25);
            --bg-sub-wrapper: #fdf7ed;
            --border-sub: #e4d0aa;
            --bg-sub-tab-inactive: #ebdbb8;
            --text-sub-tab-inactive: #6a4a1a;
            --bg-sub-tab-active: #b48a3a;
            --text-sub-tab-active: white;
            --bg-sub-tab-hover: #e4d0aa;
            --iframe-bg: #f5e8d0;
            --modal-bg: #fdf7ed;
            --button-outline-border: #c9a87a;
            --button-outline-text: #6a4a1a;
            --shadow-color: rgba(180, 138, 58, 0.15);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
            background: var(--bg-body);
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .viewer-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .viewer-header {
            background: var(--bg-header);
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-header);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(2px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .viewer-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-header);
            letter-spacing: -0.3px;
            transition: color 0.3s ease;
        }
        .viewer-tabs-wrapper {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-header);
            flex-shrink: 0;
            padding: 0.75rem 1.5rem 0 1.5rem;
            position: relative;
            z-index: 2;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .viewer-tabs-scroll {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 0.6rem;
            scrollbar-width: thin;
        }
        .viewer-tabs-list {
            display: flex;
            gap: 0.7rem;
        }
        .viewer-tab {
            background: var(--bg-tab-inactive);
            border: none;
            padding: 0.6rem 1.3rem;
            font-size: 0.9rem;
            font-weight: 550;
            border-radius: 40px;
            color: var(--text-tab-inactive);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: var(--tab-shadow);
            backdrop-filter: blur(2px);
            letter-spacing: 0.3px;
        }
        .viewer-tab:hover {
            transform: translateY(-1px);
            background: color-mix(in srgb, var(--bg-tab-inactive) 85%, white);
            box-shadow: var(--tab-shadow-hover);
        }
        .viewer-tab.active {
            background: var(--bg-tab-active);
            color: var(--text-tab-active);
            transform: scale(1.02);
            box-shadow: 0 6px 14px var(--shadow-color);
            font-weight: 600;
        }
        .viewer-sub-tabs-wrapper {
            background: var(--bg-sub-wrapper);
            border-bottom: 1px solid var(--border-sub);
            flex-shrink: 0;
            padding: 0.5rem 1.5rem 0 1.5rem;
            position: relative;
            z-index: 1;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .viewer-sub-tabs-list {
            display: flex;
            gap: 0.5rem;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .viewer-sub-tab {
            background: var(--bg-sub-tab-inactive);
            border: none;
            padding: 0.45rem 1rem;
            font-size: 0.78rem;
            font-weight: 500;
            border-radius: 32px;
            color: var(--text-sub-tab-inactive);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .viewer-sub-tab:hover {
            background: var(--bg-sub-tab-hover);
            transform: translateY(-1px);
        }
        .viewer-sub-tab.active {
            background: var(--bg-sub-tab-active);
            color: var(--text-sub-tab-active);
            box-shadow: 0 3px 8px var(--shadow-color);
            font-weight: 550;
        }
        .iframe-container {
            flex: 1;
            background: var(--iframe-bg);
            position: relative;
            transition: background 0.3s ease;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            transition: opacity 0.2s;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 0;
        }
        .loading-spinner {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 1rem 2rem;
            border-radius: 60px;
            display: flex;
            gap: 1rem;
            align-items: center;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.25);
            font-weight: 500;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .spinner-circle {
            width: 1.5rem;
            height: 1.5rem;
            border: 3px solid #cbd5e1;
            border-top-color: var(--bg-tab-active);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--modal-bg);
            color: var(--text-header);
            border-radius: 2rem;
            padding: 28px 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border-header);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .modal-content .logo {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 16px 0;
            font-size: 1.2rem;
        }
        .modal-content a {
            color: var(--bg-tab-active);
        }
        button.outline {
            background: transparent;
            border: 1px solid var(--button-outline-border);
            color: var(--button-outline-text);
            padding: 6px 16px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        button.outline:hover {
            background: color-mix(in srgb, var(--button-outline-border) 20%, transparent);
            transform: scale(0.97);
        }
        .loading-title {
            opacity: 0.6;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @media (max-width: 640px) {
            .viewer-tabs-wrapper { padding: 0.5rem 0.8rem 0 0.8rem; }
            .viewer-sub-tabs-wrapper { padding: 0.3rem 0.8rem 0 0.8rem; }
            .viewer-header { padding: 10px 16px; }
            .viewer-tab { padding: 0.45rem 1rem; font-size: 0.8rem; }
            .viewer-sub-tab { padding: 0.35rem 0.8rem; font-size: 0.7rem; }
        }
        .viewer-tabs-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .viewer-tabs-scroll::-webkit-scrollbar-track {
            background: var(--border-header);
            border-radius: 10px;
        }
        .viewer-tabs-scroll::-webkit-scrollbar-thumb {
            background: var(--bg-tab-active);
            border-radius: 10px;
        }
        .trip-today-badge {
            background: var(--bg-tab-active);
            color: white;
            font-size: 0.65rem;
            border-radius: 30px;
            padding: 2px 8px;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="viewer-container">
    <div class="viewer-header">
        <h1 id="viewerTitle"><span class="loading-title">⏳ 載入中...</span></h1>
        <button id="aboutBtn" class="outline">ℹ️ 關於</button>
    </div>
    <div class="viewer-tabs-wrapper">
        <div class="viewer-tabs-scroll">
            <div class="viewer-tabs-list" id="mainTabs"></div>
        </div>
    </div>
    <div id="subTabsWrapper" class="viewer-sub-tabs-wrapper" style="display: none;">
        <div class="viewer-sub-tabs-list" id="subTabs"></div>
    </div>
    <div class="iframe-container" id="iframeContainer">
        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="loading-spinner">
                <div class="spinner-circle"></div>
                <span>載入中，請稍後...</span>
            </div>
        </div>
        <iframe id="contentIframe" title="內容" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads"></iframe>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBv4ft0YCyyvzHQM-wQgMKsW3uDSzbYaZo",
        authDomain: "travellink-a3a2d.firebaseapp.com",
        databaseURL: "https://travellink-a3a2d-default-rtdb.firebaseio.com",
        projectId: "travellink-a3a2d",
        storageBucket: "travellink-a3a2d.firebasestorage.app",
        messagingSenderId: "312024413763",
        appId: "1:312024413763:web:a3e4b33c4f4b99656e46f6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const projectCode = params.get('projectCode');
    if (!projectCode) {
        document.getElementById('viewerTitle').innerText = '❌ 缺少專案代碼';
        document.getElementById('contentIframe').srcdoc = '<html><body style="background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">❌ 無效連結</body></html>';
    } else {
        loadProject(projectCode);
    }

    // ========== 記憶核心 ==========
    function getStorageKey(projectCode, type) {
        return `viewer_memory_${projectCode}_${type}`;
    }
    function saveMainTabMemory(projectCode, mainItemId) {
        if (!projectCode || !mainItemId) return;
        try { localStorage.setItem(getStorageKey(projectCode, 'mainTab'), mainItemId); } catch(e) {}
    }
    function getMainTabMemory(projectCode) {
        if (!projectCode) return null;
        try { return localStorage.getItem(getStorageKey(projectCode, 'mainTab')); } catch(e) { return null; }
    }
    function saveSubTabMemory(projectCode, subItemId) {
        if (!projectCode || !subItemId) return;
        try { localStorage.setItem(getStorageKey(projectCode, 'subTab'), subItemId); } catch(e) {}
    }
    function getSubTabMemory(projectCode) {
        if (!projectCode) return null;
        try { return localStorage.getItem(getStorageKey(projectCode, 'subTab')); } catch(e) { return null; }
    }

    // 輔助: 解析日期 (支援 YYYY-MM-DD)
    function parseISODate(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const day = parseInt(parts[2], 10);
        const date = new Date(year, month, day);
        if (isNaN(date.getTime())) return null;
        return date;
    }

    // 判斷今日是否在行程區間內，並返回對應的子項目 (根據日期精確比對)
    function findTodaySubItemInTrip(mainItem, todayDate) {
        if (!mainItem.isTrip) return null;
        const startISO = mainItem.tripStartDate;
        const endISO = mainItem.tripEndDate;
        if (!startISO || !endISO) return null;
        const startDate = parseISODate(startISO);
        const endDate = parseISODate(endISO);
        if (!startDate || !endDate) return null;
        const today = todayDate || new Date();
        const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        if (todayMidnight < startDate || todayMidnight > endDate) return null;
        
        const subItems = mainItem.subItems || [];
        const todayISO = todayMidnight.toISOString().split('T')[0];
        const matchedSub = subItems.find(sub => sub.date === todayISO && !sub.isOverview);
        if (matchedSub) return matchedSub;
        const overviewSub = subItems.find(sub => sub.isOverview === true);
        return overviewSub || null;
    }

    // 決定某主項目點擊後應優先顯示的子項目
    function getDefaultSubItemForMain(mainItem, rememberedSubId, existingSubItemsMap) {
        if (!mainItem) return null;
        if (mainItem.isTrip) {
            const todaySub = findTodaySubItemInTrip(mainItem, new Date());
            if (todaySub && existingSubItemsMap.has(todaySub.id)) {
                return todaySub;
            }
            const overviewSub = (mainItem.subItems || []).find(sub => sub.isOverview === true);
            if (overviewSub && existingSubItemsMap.has(overviewSub.id)) {
                return overviewSub;
            }
        }
        if (rememberedSubId && existingSubItemsMap.has(rememberedSubId)) {
            return existingSubItemsMap.get(rememberedSubId);
        }
        return null;
    }

    async function loadProject(code) {
        try {
            const snapshot = await db.ref('projects/' + code).once('value');
            const data = snapshot.val();
            if (!data) throw new Error('專案不存在或已被刪除');

            const theme = data.theme || 'default';
            document.documentElement.setAttribute('data-theme', theme);
            
            // 顯示專案名稱
            const projectName = data.projectName || '未命名專案';
            document.getElementById('viewerTitle').innerText = projectName;
            document.title = projectName + ' | 專案檢視模式';
            
            const mainItems = data.mainItems || [];
            mainItems.forEach(item => {
                if (item.isTrip === undefined) item.isTrip = false;
                if (item.tripStartDate === undefined) item.tripStartDate = '';
                if (item.tripEndDate === undefined) item.tripEndDate = '';
                if (!item.subItems) item.subItems = [];
                item.subItems.forEach(sub => {
                    if (sub.date === undefined) sub.date = '';
                    if (sub.isOverview === undefined) sub.isOverview = false;
                });
            });
            renderTabsWithSmartRules(code, mainItems);
        } catch (err) {
            document.getElementById('viewerTitle').innerText = '⚠️ 載入失敗';
            document.getElementById('contentIframe').srcdoc = `<html><body style="background:#f8fafc;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">⚠️ ${err.message}</body></html>`;
        }
    }

    function renderTabsWithSmartRules(projectCode, mainItems) {
        const mainTabsDiv = document.getElementById('mainTabs');
        const subTabsWrapper = document.getElementById('subTabsWrapper');
        const subTabsDiv = document.getElementById('subTabs');
        const iframe = document.getElementById('contentIframe');
        const loading = document.getElementById('loadingOverlay');

        function showLoading() { loading.style.display = 'flex'; }
        function hideLoading() { loading.style.display = 'none'; }
        function loadUrl(url) {
            if (!url || url.trim() === '') {
                iframe.srcdoc = `<html><body style="background:var(--bg-body);color:var(--text-header);display:flex;align-items:center;justify-content:center;font-family:sans-serif;padding:2rem;">📂 暫無內容或連結失效</body></html>`;
                hideLoading();
                return;
            }
            showLoading();
            iframe.onload = () => { hideLoading(); };
            iframe.onerror = () => {
                iframe.srcdoc = `<html><body style="background:var(--bg-body);color:var(--text-header);display:flex;align-items:center;justify-content:center;font-family:sans-serif;">⚠️ 無法載入該網址</body></html>`;
                hideLoading();
            };
            iframe.src = url;
        }

        const mainButtons = new Map();
        mainTabsDiv.innerHTML = '';
        let currentSubMap = new Map();

        function switchToMainItem(mainItem, skipMemorySave = false) {
            if (!mainItem) return;
            if (!skipMemorySave) saveMainTabMemory(projectCode, mainItem.id);
            document.querySelectorAll('.viewer-tab').forEach(btn => btn.classList.remove('active'));
            const activeMainBtn = mainButtons.get(mainItem.id);
            if (activeMainBtn) activeMainBtn.classList.add('active');

            // 有直接連結的主項目 (且非行程模式，行程模式一律走子頁籤)
            if (mainItem.link && mainItem.link.trim() !== '' && !mainItem.isTrip) {
                subTabsWrapper.style.display = 'none';
                subTabsDiv.innerHTML = '';
                loadUrl(mainItem.link);
                saveSubTabMemory(projectCode, null);
                return;
            }

            const subItems = mainItem.subItems || [];
            subTabsWrapper.style.display = 'block';
            subTabsDiv.innerHTML = '';
            currentSubMap.clear();

            if (!subItems.length) {
                const hintSpan = document.createElement('span');
                hintSpan.style.cssText = 'padding:6px 12px; font-size:0.75rem; color:var(--text-sub-tab-inactive); opacity:0.8;';
                hintSpan.innerText = '✨ 此項目無子頁面';
                subTabsDiv.appendChild(hintSpan);
                loadUrl(null);
                saveSubTabMemory(projectCode, null);
                return;
            }

            const subButtons = [];
            subItems.forEach(sub => {
                const subBtn = document.createElement('button');
                subBtn.className = 'viewer-sub-tab';
                let displayName = sub.name;
                if (mainItem.isTrip && sub.isOverview && !displayName.includes('📋')) {
                    displayName = `📋 ${displayName}`;
                }
                subBtn.textContent = displayName;
                subBtn.dataset.id = sub.id;
                subBtn.dataset.link = sub.link || '';
                subBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.viewer-sub-tab').forEach(s => s.classList.remove('active'));
                    subBtn.classList.add('active');
                    saveSubTabMemory(projectCode, sub.id);
                    loadUrl(sub.link);
                });
                subTabsDiv.appendChild(subBtn);
                currentSubMap.set(sub.id, subBtn);
                subButtons.push(subBtn);
            });

            const rememberedSubId = getSubTabMemory(projectCode);
            let targetSub = getDefaultSubItemForMain(mainItem, rememberedSubId, currentSubMap);
            
            if (!targetSub && rememberedSubId && currentSubMap.has(rememberedSubId)) {
                targetSub = currentSubMap.get(rememberedSubId);
            }
            if (!targetSub && subButtons.length > 0) {
                targetSub = subButtons[0];
            }
            
            if (targetSub) {
                targetSub.click();
            } else {
                loadUrl(null);
            }
        }

        // 建立主項目按鈕
        mainItems.forEach((item) => {
            const btn = document.createElement('button');
            btn.className = 'viewer-tab';
            let btnText = item.name;
            if (item.isTrip && item.tripStartDate && item.tripEndDate) {
                btnText += ` ✈️`;
            }
            btn.textContent = btnText;
            btn.dataset.id = item.id;
            btn.dataset.link = item.link || '';
            mainButtons.set(item.id, btn);
            btn.addEventListener('click', (e) => {
                switchToMainItem(item, false);
            });
            mainTabsDiv.appendChild(btn);
        });

        const rememberedMainId = getMainTabMemory(projectCode);
        let targetMainItem = null;
        if (rememberedMainId && mainButtons.has(rememberedMainId)) {
            targetMainItem = mainItems.find(m => m.id === rememberedMainId);
        }
        if (!targetMainItem && mainItems.length > 0) {
            targetMainItem = mainItems[0];
        }
        if (targetMainItem) {
            switchToMainItem(targetMainItem, true);
        } else {
            subTabsWrapper.style.display = 'none';
            loadUrl(null);
        }
    }

    // 關於視窗 (更新版，包含新主題說明)
    function showAboutModal() {
        if (document.querySelector('.modal')) return;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>✨ 智慧行程檢視系統</h3>
                <div class="logo">
                    <span>🎨 多主題</span>
                    <span>🧠 智慧記憶</span>
                    <span>📅 行程日期對應</span>
                </div>
                <p style="margin-top:8px; font-size:0.9rem;">
                    🍁 楓葉 · 🌿 銀杏 · 🍁🌿 楓葉+銀杏
                </p>
                <p>構想聯繫：<a href="mailto:jumper.hsu@gmail.com" style="color: var(--bg-tab-active);">jumper.hsu@gmail.com</a></p>
                <p>設計開發：DeepSeek</p>
                <p>版本：<strong>2026.05.15 行程頁籤簡潔版 + 新主題</strong></p>
                <p style="font-size:0.75rem; margin-top:12px;">✓ 行程子頁籤只顯示名稱，不顯示日期<br>✓ 行程區間自動跳轉今日頁籤<br>✓ 記憶與智慧規則並存</p>
                <button id="closeAboutBtn" class="outline" style="margin-top: 20px;">關閉視窗</button>
            </div>
        `;
        document.body.appendChild(modal);
        const closeBtn = document.getElementById('closeAboutBtn');
        if (closeBtn) closeBtn.onclick = () => modal.remove();
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    }
    document.getElementById('aboutBtn').addEventListener('click', showAboutModal);
</script>
